name: 每日更新新聞

on:
  schedule:
    - cron: "17 23 * * *"   # 台灣時間每天 07:17
  workflow_dispatch:         # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝圖片處理套件
        run: pip install pillow

      - name: 從 Notion 匯出
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_NEWS_DB: ${{ secrets.NOTION_NEWS_DB }}
          NOTION_DAYS_DB: ${{ secrets.NOTION_DAYS_DB }}
        run: python scripts/export_notion.py

      - name: 有變動就存回專案
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data photos illustrations
          if git diff --cached --quiet; then
            echo "沒有新資料。"
          else
            git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
