name: 每日同步 Notion

on:
  schedule:
    - cron: "7 1,2 * * *"   # 台灣時間每天 09:07、10:07（Notion 約 9 點前寫完；第二次補抓晚到的資料）
  workflow_dispatch:         # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝圖片處理套件
        run: pip install pillow

      - name: 從 Notion 同步
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: 有變動就存回專案
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data photos illustrations
          if git diff --cached --quiet; then
            echo "沒有新資料。"
          else
            git commit -m "每日同步 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
