<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>今日新聞彙整（首頁預覽）</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 單欄手機版，最寬 600px 置中；底部固定導覽 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F5F5F2; --line:#E7E6E1;
  --fg:#17181C; --fg2:#3F4148; --muted:#62646B; --hatch:rgba(23,24,28,.045); --illo:#EFEBE2;
  --cat-bg:#F0EFEA; --cat:#3F4148;
  --ok-bg:#E3F1E6; --ok:#1E6235; --mid-bg:#FBF0D6; --mid:#7A5300; --bad-bg:#FBE3E0; --bad:#9A2A1E;
  --wait-bg:#ECECEF; --wait:#4B4E57; --view-bg:#E5ECF6; --view:#2B4870; --cut-bg:#FBE8D8; --cut:#8A4310;
  --green-bg:#E2F0E6; --green:#21603A; --blue-bg:#E2EAF7; --blue:#244C86;
  --sans:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141518; --surface:#1B1C20; --soft:#212226; --line:#2F3036; --fg:#F1F1EE; --fg2:#D0D1D5; --muted:#A0A2A9;
  --hatch:rgba(255,255,255,.04); --illo:#2A2722; --cat-bg:#26272C; --cat:#D0D1D5;
  --ok-bg:#1F3627; --ok:#9AD6AC; --mid-bg:#3A3019; --mid:#EBC97A; --bad-bg:#43231F; --bad:#F2AEA4;
  --wait-bg:#2A2B30; --wait:#C4C6CC; --view-bg:#22304A; --view:#B9CDEE; --cut-bg:#43301F; --cut:#F1BE90;
  --green-bg:#1F3627; --green:#9AD6AC; --blue-bg:#22304A; --blue:#B9CDEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1B1C20; --soft:#212226; --line:#2F3036; --fg:#F1F1EE; --fg2:#D0D1D5; --muted:#A0A2A9;
  --hatch:rgba(255,255,255,.04); --illo:#2A2722; --cat-bg:#26272C; --cat:#D0D1D5;
  --ok-bg:#1F3627; --ok:#9AD6AC; --mid-bg:#3A3019; --mid:#EBC97A; --bad-bg:#43231F; --bad:#F2AEA4;
  --wait-bg:#2A2B30; --wait:#C4C6CC; --view-bg:#22304A; --view:#B9CDEE; --cut-bg:#43301F; --cut:#F1BE90;
  --green-bg:#1F3627; --green:#9AD6AC; --blue-bg:#22304A; --blue:#B9CDEE; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;text-decoration:none}
.brand i{width:11px;height:11px;border-radius:50%;background:var(--fg);display:inline-block}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px}

.view{display:flex;flex-direction:column;gap:22px;padding-top:4px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.date{font-size:13px;color:var(--muted)}
.h1{font-family:var(--serif);font-size:27px;line-height:1.35;font-weight:700}
.h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}

.hero{border-radius:22px;overflow:hidden;background:var(--illo);aspect-ratio:1/1;max-width:100%}
.hero img{width:100%;height:100%;object-fit:cover;display:block}

.top3{border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.top3 ol{margin:0;padding:0;list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:10px}
.top3 li{counter-increment:n;display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;font-size:15.5px;line-height:1.65}
.top3 li::before{content:counter(n);font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.4;color:var(--muted)}
.follow{background:var(--soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.follow ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip small{font-size:12px;opacity:.7}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--cat-bg);color:var(--cat)}
.pill.line{background:transparent;border:1px solid var(--line);color:var(--fg2)}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-mid{background:var(--mid-bg);color:var(--mid)}
.s-bad{background:var(--bad-bg);color:var(--bad)} .s-wait{background:var(--wait-bg);color:var(--wait)}
.s-view{background:var(--view-bg);color:var(--view)} .s-cut{background:var(--cut-bg);color:var(--cut)}
.l-green{background:var(--green-bg);color:var(--green)} .l-blue{background:var(--blue-bg);color:var(--blue)}
.l-neutral{background:var(--wait-bg);color:var(--wait)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.list{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);text-decoration:none}
.card .main{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;align-items:start}
.card h3{font-size:16px;line-height:1.5;font-weight:700}
.card p{font-size:14px;color:var(--fg2);line-height:1.7;margin-top:4px}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--soft);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 8px,transparent 8px 16px);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.thumb img,.photo img{width:100%;height:100%;object-fit:cover;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tags .gap{color:var(--mid)}

.photo{aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:var(--soft);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 10px,transparent 10px 20px);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);max-width:100%}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figcaption{font-size:12px;color:var(--muted)}
.ttl{font-family:var(--serif);font-size:24px;line-height:1.45;font-weight:700}
.legend-box{border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.legend-box summary{cursor:pointer;font-weight:600;color:var(--fg2);min-height:28px;display:flex;align-items:center}
.legend-box dl{margin:10px 0 2px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center}
.legend-box dd{margin:0;color:var(--fg2);line-height:1.6}
.gapbox{font-size:13.5px;color:var(--mid);background:var(--mid-bg);border-radius:12px;padding:10px 12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec > h2{font-size:17px;font-weight:700}
.lead{background:var(--soft);border-radius:16px;padding:16px 18px;font-size:16px;line-height:1.8}
.lead h2{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.rich{font-size:16px;line-height:1.75;color:var(--fg);display:flex;flex-direction:column;gap:8px;min-width:0}
.rich ul,.rich ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.rich li > ul,.rich li > ol{margin-top:7px}
.rich b{color:var(--fg)}
.rich a{text-underline-offset:3px;overflow-wrap:anywhere}
.rich blockquote{margin:0;padding:10px 14px;background:var(--soft);border-radius:12px}
.rich hr{border:0;border-top:1px solid var(--line);width:100%}
.mark{margin-right:6px;vertical-align:1px}
.rich.sides > ul{list-style:none;padding-left:0;gap:12px}
.rich.sides > ul > li{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rich.sides > ul > li > ul{list-style:none;padding-left:0}
.prior{display:flex;flex-direction:column}
.prior a{display:flex;gap:12px;min-height:44px;align-items:flex-start;text-decoration:none;padding-block:8px;border-bottom:1px solid var(--line)}
.prior a span:first-child{flex:0 0 44px;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.issue{font-size:13.5px;color:var(--muted)}
.srcs{display:flex;flex-direction:column}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:48px;padding-block:8px;border-bottom:1px solid var(--line);text-decoration:none}
.src b{font-size:14.5px;display:block}
.src span.t{font-size:13px;color:var(--muted);display:block}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.filters{display:flex;flex-direction:column;gap:10px}
.selects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.selects label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.selects select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;font-size:14px;color:var(--fg);min-width:0}
.claim{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.claim h3{font-size:15.5px;line-height:1.55}
.claim .who{font-size:12.5px;color:var(--muted)}
.claim q{display:block;quotes:none;font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px;color:var(--fg2)}
.claim dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.claim dt{color:var(--muted)} .claim dd{margin:0;color:var(--fg2)}
.claim .links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.claim .links a{overflow-wrap:anywhere}

.day{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none}
.day b{font-size:15px;font-variant-numeric:tabular-nums} .day > span{font-size:13px;color:var(--muted);flex:0 0 auto}
.day p{font-size:13.5px;color:var(--fg2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav a{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--fg);font-weight:700}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ---- 事件頁新版 ---- */
.ev{display:flex;flex-direction:column;gap:30px}
.ev-head{display:flex;flex-direction:column;gap:12px}
.ev .photo{aspect-ratio:16/9}
.ev .sec{gap:12px}
.ev .sec > h2{font-size:18px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.leadbox{display:flex;flex-direction:column;gap:6px}
.leadbox h2{font-size:14px;color:var(--muted);font-weight:700}
.leadbox .rich{font-size:17.5px;line-height:1.75}
.think{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.think h2{font-size:14px !important;color:var(--muted)}
.think .rich{font-size:16px}

.cov{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:16px;padding:14px 16px}
.cov h2{font-size:13px;color:var(--muted);font-weight:700}
.cov-bar{display:flex;gap:3px;height:10px}
.cov-bar span{border-radius:999px;min-width:10px}
.cov-bar .g{background:var(--green)} .cov-bar .n{background:var(--wait)} .cov-bar .b{background:var(--blue)}
.cov-bar .z{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px);border:1px dashed var(--line)}
.cov-rows{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 10px;align-items:baseline;font-size:14px}
.cov-rows b{font-variant-numeric:tabular-nums}
.cov-rows .names{color:var(--fg2)}
.cov-rows .none{color:var(--muted)}
.cov-note{font-size:13.5px;color:var(--fg2);line-height:1.6}
.cov-note b{color:var(--mid)}
.covmini{display:inline-flex;gap:8px;align-items:center}
.covmini i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}
.covmini .g{background:var(--green)} .covmini .n{background:var(--wait)} .covmini .b{background:var(--blue)}
.covmini .zero{opacity:.45}

.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.facts > li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;font-size:16px;line-height:1.7}
.facts > li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:.7em}
.facts .by{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.facts ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--fg2)}

.speakers{display:flex;flex-direction:column;gap:10px}
.speaker{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.speaker h3{font-size:15px}
.say{display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.7}
.say .pill{align-self:flex-start}
.need{font-size:13.5px;line-height:1.6;color:var(--fg2);background:var(--mid-bg);border-radius:10px;padding:8px 10px}
.need b{color:var(--mid)}

.diffs{display:flex;flex-direction:column;gap:10px}
.diff{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.diff h3{font-size:15.5px;line-height:1.5}
.diff > p{font-size:15px;line-height:1.7;color:var(--fg)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;line-height:1.65}
.row .pill{justify-content:center;margin-top:1px}
.row.plain{grid-template-columns:44px minmax(0,1fr)}
.row.plain::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);justify-self:center;margin-top:.65em}
.concl{font-size:14.5px;line-height:1.65;background:var(--soft);border-radius:10px;padding:8px 12px}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.65}
.checks .pill{align-self:flex-start}
.morelink{font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px;min-height:44px}

.fold{border:1px solid var(--line);border-radius:16px;padding:0 16px}
.fold > summary{cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:700;list-style:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"＋";font-weight:400;color:var(--muted)}
.fold[open] > summary::after{content:"－"}
.fold > summary small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.fold .inner{padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.heads{display:flex;flex-direction:column;gap:14px}
.heads h4{margin:0 0 6px;font-size:13px}
.heads ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.heads li{font-size:14px;line-height:1.55}
.heads li b{margin-right:6px}

.legend2{display:flex;flex-direction:column;gap:16px}
.legend2 h3{font-size:14px;color:var(--muted)}
.legend2 dl{margin:6px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:start}
.legend2 dt .pill{white-space:nowrap}
.legend2 dd{margin:0;font-size:15px;line-height:1.6;color:var(--fg2)}

/* ---- 三層版 ---- */
.covline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.covline .covmini{gap:10px}
.gapline{font-size:13px;color:var(--mid);line-height:1.6}
.summary{background:var(--soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.summary h2{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.summary .rich{font-size:17px;line-height:1.75}
.summary .think .rich{font-size:15.5px;color:var(--fg2)}
.summary .think{border-top:1px solid var(--line);padding-top:12px;border-radius:0;border-left:0;border-right:0;border-bottom:0}
.bg .rich{font-size:15px;color:var(--fg2)}
.bg .issue{font-size:13px}

.tabs{display:flex;flex-direction:column;gap:12px}
.tabs > input{position:absolute;opacity:0;pointer-events:none}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg label{min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg label small{font-size:12px;opacity:.8}
.panel{display:none}
.tabs > input:nth-of-type(1):checked ~ .seg label:nth-of-type(1),
.tabs > input:nth-of-type(2):checked ~ .seg label:nth-of-type(2){background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs > input:nth-of-type(1):checked ~ .p1,
.tabs > input:nth-of-type(2):checked ~ .p2{display:block}
.tabs > input:focus-visible ~ .seg{outline:2px solid var(--fg);outline-offset:2px}
.speaker h3{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.speaker h3 .names{font-weight:700}
.tip{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tip > h3{font-size:14px;color:var(--muted)}
.tipcard{background:var(--mid-bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.65}
.tipcard b{color:var(--fg)}
.tipcard .rows{gap:6px}
.deeper{display:flex;flex-direction:column;gap:10px}
.deeper > p{font-size:13px;color:var(--muted);font-weight:700}
.srcgroup{display:flex;flex-direction:column;gap:6px}
.srcgroup h4{margin:6px 0 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.srcgroup a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;padding-block:6px;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px;line-height:1.5}
.srcgroup a b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.srcnote{font-size:13px;color:var(--muted);line-height:1.6}
.say .by{font-size:12.5px;color:var(--muted);margin-top:-2px}
.summary .think{display:block;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 0}
.summary .rich,.summary .think .rich{font-size:16.5px;line-height:1.75;color:var(--fg)}
.summary h2,.summary .think h2{font-size:13px !important;color:var(--muted);font-weight:700;margin:0 0 4px}
.series{align-self:flex-start;font-size:12.5px;color:var(--fg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.need{background:var(--soft) !important;color:var(--muted) !important;font-size:13px !important}
.need b{color:var(--fg2) !important;font-weight:600}
.say > .pill,.checks .pill{font-size:12.5px;font-weight:700;padding:4px 10px}
.say{display:block}
.say > .pill{display:inline-flex;margin-right:6px;vertical-align:2px}
.say .by{display:block;margin-top:2px}
.say .need{margin-top:6px}

/* ---- 首頁：分類固定在最上面 ---- */
.top{flex-wrap:wrap;padding-bottom:0;border-bottom:1px solid transparent}
.top.with-tabs{border-bottom-color:var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
#subnav{width:100%}
#subnav:empty{display:none}
.cattabs{display:flex;gap:4px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 0;scrollbar-width:none}
.cattabs::-webkit-scrollbar{display:none}
.cattab{flex:0 0 auto;min-height:44px;padding:0 12px;border:0;background:none;font-size:15.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;display:inline-flex;align-items:center;gap:5px}
.cattab small{font-size:12px;opacity:.75}
.cattab[aria-pressed="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--fg)}
.top{padding-block:12px 0}
.daybar{display:flex;align-items:center;gap:10px}
.card .pills{align-items:center}
.card{position:relative}
.card.hl .pills{padding-right:72px}
.star{position:absolute;top:14px;right:14px;background:var(--fg);color:var(--bg);font-weight:700}
.daybar{margin-top:6px}
.rich ol{padding-left:30px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"><div class="brandrow"><a class="brand" href="#today"><i></i><span id="siteName"></span></a></div><div id="subnav"></div></header>
  <main id="view" class="view"><p class="empty">載入中…</p></main>
</div>
<nav class="nav" aria-label="主選單"><div id="nav"></div></nav>

<script>
const CONFIG = { siteName: '[平台名稱]' };

/* ---------- 資料（由 scripts/sync_notion.py 每天產生） ---------- */
const cache = {};
async function getJSON(path){
  if (cache[path]) return cache[path];
  const r = await fetch(path, { cache: 'no-cache' });   // 每次都向伺服器確認有沒有新版本
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return cache[path] = await r.json();
}
const getIndex = () => getJSON('data/index.json');
const getDay = d => getJSON(`data/days/${d}.json`);
const getClaims = () => getJSON('data/claims.json');
const getPrinciples = () => getJSON('data/principles.json');

/* ---------- 小工具 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEK = ['日','一','二','三','四','五','六'];
const dt = d => new Date(d + 'T00:00:00');
const fmtDay = d => { const x = dt(d); return `${x.getMonth()+1} 月 ${x.getDate()} 日 星期${WEEK[x.getDay()]}`; };
const fmtShort = d => { const x = dt(d); return `${x.getMonth()+1}/${x.getDate()}`; };
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return u; } };
const pick = (map, s) => map[Object.keys(map).find(k => (s || '').startsWith(k))];

/* 標記：同一個圖示在整個網站只用一個名稱（事件查證狀態、說法標記、查證追蹤都一樣） */
const LABELS = {
  '✅':['✅','已證實','s-ok','有一手資料（官方文件、數據、完整影音），或多家各自採訪的報導一致'],
  '⚖':['⚖️','各說各話','s-mid','各方說法不同，目前沒有證據能判斷誰對'],
  '⏳':['⏳','待確認','s-wait','剛發生，可靠資料還不夠，之後會補'],
  '❌':['❌','有誤','s-bad','有證據證明說法或報導是錯的'],
  '🔍':['🔍','待證據','s-mid','可以查證，但還沒有人拿出證據'],
  '💬':['💬','觀點','s-view','解讀、評價或預測，本來就沒有真假'],
  '⚠':['⚠️','誤導','s-cut','沒有造假，但標題或數字的寫法容易讓人誤會'],
  '✂':['✂️','斷章取義','s-cut','原話是真的，但剪掉前後文，意思被改變'],
  '🕐':['🕐','久未舉證','s-wait','超過 30 天沒人拿出證據（不代表是假的）']
};
const EVENT_MARKS = ['✅','⚖','⏳','❌'];
const CLAIM_MARKS = ['✅','🔍','💬','⚠','✂','❌','🕐'];
const MARK_RE = /^\s*(✅|🔍|💬|⚖️?|⏳|⚠️?|✂️?|❌|🕐)\s*/;
const markKey = s => { const m = (s || '').match(MARK_RE); return m ? m[1].replace(/️/g, '') : null; };
const EVENT_LABEL = { '✅':['✅','經過已證實','s-ok','事件本身（誰、何時、做了什麼）已有一手資料或多家各自採訪的報導證實；事件裡個別的說法另外標示'] };
const pendingCount = e => {
  const s = (e.sections || []).find(x => x.title.startsWith('各方說法')); let n = 0;
  const walk = ns => (ns || []).forEach(x => { if (/^\s*🔍/.test(runsText(x.r))) n++; walk(x.c); });
  if (s) walk(s.body); return n;
};
const statusPill = (s, ev) => {
  const k = markKey(s);
  if (!k) return s ? `<span class="pill s-wait">${esc(s)}</span>` : '';
  const [e, l, c, d] = (ev && EVENT_LABEL[k]) || LABELS[k];
  return `<span class="pill ${c}" title="${esc(d)}">${e} ${l}</span>`;
};
const labelOf = s => { const k = markKey(s); return k ? `${LABELS[k][0]} ${LABELS[k][1]}` : (s || ''); };
/* Notion 文字裡舊名稱的寫法，顯示時統一 */
const normText = t => String(t ?? '')
  .replace(/✅\s*(事實|屬實)/g, '✅ 已證實').replace(/❌\s*(報導有誤|不實)/g, '❌ 有誤').replace(/⚠️?\s*部分正確/g, '⚠️ 誤導');
const LEAN = { green:['偏綠','l-green'], blue:['偏藍','l-blue'], neutral:['中立','l-neutral'] };
const shortName = n => String(n || '').replace(/\s*(新聞網|新聞雲|新聞|Newtalk)$/i, '').trim();
const OUTLETS = ['中央社','公視','聯合','中時','中國時報','TVBS','自由','三立','民視','新頭殼','ETtoday','鏡週刊','鏡','報導者','風傳媒','太報','更生日報','壹蘋','關鍵評論網','東森','華視','Yahoo'];

const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  ext:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
  claims:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/><path d="M8.5 11l1.8 1.8 3.4-3.6"/></svg>',
  archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  rules:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>'
};

/* Notion 內文 → HTML */
function runsHTML(rs){
  return (rs || []).map(r => {
    let h = esc(normText(r.x));
    if (r.b) h = `<b>${h}</b>`;
    if (r.i) h = `<i>${h}</i>`;
    if (r.a) h = `<a href="${esc(r.a)}" target="_blank" rel="noopener">${h}</a>`;
    return h;
  }).join('');
}
function withMark(rs){
  const first = rs && rs[0] ? rs[0].x : '';
  const m = first.match(MARK_RE);
  if (!m) return runsHTML(rs);
  const after = first.slice(m[0].length).replace(/^(已證實|事實|屬實|各說各話|報導有誤|有誤|不實|待確認|待證據|觀點|誤導|部分正確|斷章取義|久未舉證)\s*[：:]\s*/, '');
  const rest = [{ ...rs[0], x: after }, ...rs.slice(1)];
  return `${statusPill(m[1])} ` + runsHTML(rest);
}
function nodesHTML(nodes){
  let html = '', i = 0;
  while (i < nodes.length){
    const n = nodes[i];
    if (n.t === 'li' || n.t === 'ol'){
      const tag = n.t === 'li' ? 'ul' : 'ol'; let items = '';
      while (i < nodes.length && nodes[i].t === n.t){
        const m = nodes[i++];
        items += `<li>${withMark(m.r)}${m.c ? nodesHTML(m.c) : ''}</li>`;
      }
      html += `<${tag}>${items}</${tag}>`; continue;
    }
    i++;
    if (n.t === 'hr') html += '<hr>';
    else if (n.t === 'h3') html += `<h3 style="font-size:15px">${runsHTML(n.r)}</h3>`;
    else if (n.t === 'quote' || n.t === 'callout') html += `<blockquote>${withMark(n.r)}${n.c ? nodesHTML(n.c) : ''}</blockquote>`;
    else html += `<p>${withMark(n.r)}</p>${n.c ? nodesHTML(n.c) : ''}`;
  }
  return html;
}

const img = (url, label, alt) => url
  ? `<img src="${esc(url)}" alt="${esc(alt || '')}" loading="lazy" data-fallback="${esc(label)}">` : esc(label);
const NATURE = { '🔀 混合':'🔀 政策＋選戰' };
const statusPills = (e, hideCat) => {
  const pend = markKey(e.check) === '✅' ? pendingCount(e) : 0;
  return `
  ${e.category && !hideCat ? `<span class="pill">${esc(e.category)}</span>` : ''}
  ${e.check ? statusPill(e.check, true) : ''}
  ${pend ? `<span class="pill s-mid" title="這則裡還沒有證據的說法">🔍 ${pend} 項待證據</span>` : ''}
  ${e.nature ? `<span class="pill line">${esc(NATURE[e.nature] || e.nature)}</span>` : ''}`;
};

/* ---------- 畫面 ---------- */
const state = { cat:'全部', cf:{ status:'全部', speaker:'', party:'' } };
const $view = document.getElementById('view');
let subnavHTML = '';
/* 排列順序：性質 → 查證狀態 → Notion 排序（不依報導家數） */
const NATURE_RANK = { '📌':0, '🔀':1, '⚔':2 };
const CHECK_RANK = { '✅':0, '❌':1, '⚖':2, '⏳':3 };
const natureRank = e => { const k = Object.keys(NATURE_RANK).find(x => (e.nature || '').startsWith(x)); return k ? NATURE_RANK[k] : 3; };
const checkRank = e => { const k = markKey(e.check); return k in CHECK_RANK ? CHECK_RANK[k] : 4; };
const byPriority = (a, b) => natureRank(a) - natureRank(b) || checkRank(a) - checkRank(b) || (a.order ?? 99) - (b.order ?? 99);

function eventCard(e){
  const tags = [];
  if (e.mediaCount != null) tags.push(`<span>比對 ${e.mediaCount} 家媒體</span>`);
  const cv = coverage(e);
  tags.push(`<span class="covmini" aria-label="偏綠 ${cv.green.length} 家、中立 ${cv.neutral.length} 家、偏藍 ${cv.blue.length} 家">${
    [['green','g','綠'],['neutral','n','中'],['blue','b','藍']].map(([k, c, l]) => `<span class="${cv[k].length ? '' : 'zero'}"><i class="${c}"></i>${l} ${cv[k].length}</span>`).join('')}</span>`);
  return `<a class="card" href="#e-${e.date}-${e.id}">
    <div class="pills">${e.nature ? `<span class="pill line">${esc(NATURE[e.nature] || e.nature)}</span>` : ''}</div>
    <div class="main">
      <div style="min-width:0"><h3>${esc(e.title)}</h3>${e.summary ? `<p>${esc(e.summary)}</p>` : ''}</div>
      <div class="thumb">${img(e.photo && e.photo.url, '照片', e.title)}</div>
    </div>
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
  </a>`;
}

async function viewDay(date, isToday){
  const idx = await getIndex();
  if (!date) date = idx.latest;
  if (!date) return '<p class="empty">還沒有新聞資料。</p>';
  const d = await getDay(date);
  const CAT_ORDER = ['政治','社會','經濟','科技產業','國際'];
  const present = [...new Set(d.events.map(e => e.category).filter(Boolean))];
  const cats = [...CAT_ORDER.filter(c => present.includes(c)), ...present.filter(c => !CAT_ORDER.includes(c))];
  if (!cats.includes(state.cat)) state.cat = cats[0];
  const shown = d.events.filter(e => e.category === state.cat).sort(byPriority);
  subnavHTML = `<nav class="cattabs" aria-label="新聞類別">${cats.map(c => {
      const n = d.events.filter(e => e.category === c).length;
      return `<button class="cattab" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)}<small>${n}</small></button>`;
    }).join('')}</nav>`;
  return `
    ${idx.preview ? '<p class="note">預覽資料：每日自動同步還沒開始。</p>' : ''}
    <div class="daybar">
      ${isToday ? '' : `<a class="iconbtn" href="#archive" aria-label="回到歸檔">${I.back}</a>`}
      <p class="date">${fmtDay(d.date)}${d.coverage ? ` · 涵蓋 ${esc(d.coverage)}` : ''}</p>
    </div>
    ${d.illustration ? `<div class="hero">${img(d.illustration, '', '今日插畫')}</div>` : ''}
    ${d.followUps && d.followUps.length ? `<section class="follow"><h2 class="h2">📌 追蹤更新</h2><ul>${d.followUps.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>` : ''}
    <section class="list" aria-label="${esc(state.cat)}新聞">${shown.map(eventCard).join('') || '<p class="empty">這個類別沒有事件。</p>'}</section>`;
}

/* 各立場有哪些媒體報導（同一家多篇只算一次） */
function coverage(e){
  const out = { green:[], neutral:[], blue:[], other:[] };
  for (const s of e.sources || []) {
    const k = out[s.lean] ? s.lean : 'other', n = shortName(s.name);
    if (!out[k].includes(n)) out[k].push(n);
  }
  return out;
}
function coverageHTML(e){
  const cv = coverage(e);
  const keys = [['green','g','偏綠'],['neutral','n','中立'],['blue','b','偏藍']];
  const bar = keys.map(([k, c]) => `<span class="${cv[k].length ? c : 'z'}" style="flex:${Math.max(cv[k].length, 1)}"></span>`).join('');
  const rows = keys.map(([k, c, l]) => `<span class="pill ${LEAN[k][1]}">${l}</span><b>${cv[k].length} 家</b>${
    cv[k].length ? `<span class="names">${cv[k].map(esc).join('、')}</span>` : '<span class="none">沒找到報導</span>'}`).join('');
  const note = e.gap && !/^無/.test(e.gap.trim()) ? `<p class="cov-note"><b>要注意：</b>${esc(e.gap)}</p>` : '';
  return `<section class="cov" aria-label="哪些媒體有報導"><h2>哪些媒體有報導</h2><div class="cov-bar" aria-hidden="true">${bar}</div><div class="cov-rows">${rows}</div>${note}</section>`;
}

/* 文字片段工具 */
const runsText = rs => (rs || []).map(r => r.x).join('');
function cutRuns(rs, n){                  // 去掉開頭 n 個字
  const out = []; let left = n;
  for (const r of rs || []) {
    if (left >= r.x.length) { left -= r.x.length; continue; }
    out.push({ ...r, x: r.x.slice(left) }); left = 0;
  }
  return out;
}
function splitAt(rs, idx){                // 在第 idx 個字切成兩段
  const a = [], b = []; let pos = 0;
  for (const r of rs || []) {
    const end = pos + r.x.length;
    if (end <= idx) a.push(r);
    else if (pos >= idx) b.push(r);
    else { a.push({ ...r, x: r.x.slice(0, idx - pos) }); b.push({ ...r, x: r.x.slice(idx - pos) }); }
    pos = end;
  }
  return [a, b];
}
const isOutlet = (t, names) => [...OUTLETS, ...names].some(o => o && t.trim().startsWith(o));

/* 已確認的事實：句尾（中央社、聯合）改成小字來源 */
function factsHTML(nodes, e){
  const names = (e.sources || []).map(s => shortName(s.name));
  const items = nodes.map(n => {
    if (n.t !== 'li' && n.t !== 'ol' && n.t !== 'p') return '';
    let rs = n.r || [], by = '';
    const txt = runsText(rs), m = txt.match(/（([^（）]{1,40})）\s*。?$/);
    if (m && m[1].split(/[、，,]/).every(t => isOutlet(t, names))) { rs = splitAt(rs, m.index)[0]; by = m[1]; }
    return `<li><div>${withMark(rs)}${by ? `<span class="by">來源：${esc(by)}</span>` : ''}${n.c ? nodesHTML(n.c) : ''}</div></li>`;
  }).join('');
  return `<ul class="facts">${items}</ul>`;
}

/* 各方說法：依發言者分組，「→ 需要什麼證據」另起一行 */
function needHTML(rs){
  return runsHTML(rs).replace(/^\s*→\s*/, '')
    .replace(/(需要什麼證據|要證明)：/g, '<b>需要的證據</b>：')
    .replace(/(誰該舉證|舉證責任)：/g, '<b>誰該拿出證據</b>：');
}
function sayHTML(rs){
  const txt = runsText(rs), i = txt.indexOf('→');
  let [main, tail] = i > 0 ? splitAt(rs, i) : [rs, []], by = '';
  const mt = runsText(main), m = mt.match(/（([^（）]{1,40})）\s*。?\s*$/);
  if (m && m[1].split(/[、，,]/).every(t => isOutlet(t, []))) { main = splitAt(main, m.index)[0]; by = m[1]; }
  return `<div class="say">${withMark(main)}${by ? `<span class="by">來源：${esc(by)}</span>` : ''}${tail.length ? `<div class="need">${needHTML(tail)}</div>` : ''}</div>`;
}
function speakersHTML(nodes){
  const groups = [], byName = {};
  const add = (name, html) => { if (!byName[name]) { byName[name] = []; groups.push(name); } byName[name].push(html); };
  for (const n of nodes) {
    if (n.c && n.c.length) { add(runsText(n.r).replace(MARK_RE, '').trim(), n.c.map(c => sayHTML(c.r)).join('')); continue; }
    const rs = n.r || [], txt = runsText(rs), mk = txt.match(MARK_RE);
    const after = mk ? txt.slice(mk[0].length) : txt;
    const sp = after.match(/^([^：。]{1,30})：/);
    if (sp) {
      const body = cutRuns(rs, (mk ? mk[0].length : 0) + sp[0].length);
      add(sp[1].trim(), sayHTML(mk ? [{ x: mk[1] + ' ' }, ...body] : body));
    } else add('', sayHTML(rs));
  }
  return `<div class="speakers">${groups.map(g => `<div class="speaker">${g ? `<h3>${esc(g)}</h3>` : ''}${byName[g].join('')}</div>`).join('')}</div>`;
}

/* 各家報導的差異：每一點一張卡；「偏綠的…／偏藍的…／中央社…」變成有顏色標籤的列 */
function leanRow(rs, e){
  const txt = runsText(rs);
  if (/^\s*→/.test(txt)) return `<div class="concl">${runsHTML(cutRuns(rs, txt.indexOf('→') + 1))}</div>`;
  let m = txt.match(/^\s*(偏綠|偏藍|中立)的?\s*/);
  if (m) {
    const k = { '偏綠':'green', '偏藍':'blue', '中立':'neutral' }[m[1]];
    return `<div class="row"><span class="pill ${LEAN[k][1]}">${LEAN[k][0]}</span><div>${runsHTML(cutRuns(rs, m[0].length))}</div></div>`;
  }
  const src = (e.sources || []).find(s => LEAN[s.lean] && txt.startsWith(shortName(s.name)));
  if (src) return `<div class="row"><span class="pill ${LEAN[src.lean][1]}">${LEAN[src.lean][0]}</span><div>${runsHTML(rs)}</div></div>`;
  return null;
}
function diffsHTML(nodes, e){
  const cards = []; let pending = [];
  const flush = () => { if (pending.length) { cards.push(`<div class="diff"><h3>各家寫法</h3><div class="rows">${pending.join('')}</div></div>`); pending = []; } };
  for (const n of nodes) {
    const rs = n.r || [];
    if (n.c && n.c.length) {
      flush();
      const rows = n.c.map(c => leanRow(c.r, e) || `<div class="row plain"><div>${runsHTML(c.r)}</div></div>`).join('');
      cards.push(`<div class="diff"><h3>${runsHTML(rs)}</h3><div class="rows">${rows}</div></div>`);
      continue;
    }
    const bold = rs[0] && rs[0].b;
    const lr = bold ? null : leanRow(rs, e);
    if (lr) { pending.push(lr); continue; }
    flush();
    if (bold) {
      const rest = rs.slice(1); if (rest[0]) rest[0] = { ...rest[0], x: rest[0].x.replace(/^\s*[：:]\s*/, '') };
      cards.push(`<div class="diff"><h3>${runsHTML([rs[0]])}</h3>${rest.length ? `<p>${runsHTML(rest)}</p>` : ''}</div>`);
    } else cards.push(`<div class="diff"><p>${runsHTML(rs)}</p></div>`);
  }
  flush();
  return `<div class="diffs">${cards.join('')}</div>`;
}
function headlinesHTML(e){
  const order = [['green','偏綠'],['neutral','中立'],['blue','偏藍'],['other','其他']];
  const by = {}; for (const s of e.sources || []) if (s.title) (by[LEAN[s.lean] ? s.lean : 'other'] ||= []).push(s);
  const n = Object.values(by).reduce((a, l) => a + l.length, 0);
  if (n < 2) return '';
  return `<details class="fold"><summary><span>各家原標題對照<small>${n} 則</small></span></summary><div class="inner heads">${order.filter(([k]) => by[k]).map(([k, l]) => `
    <div><h4><span class="pill ${(LEAN[k] || ['', 'line'])[1]}">${l}</span></h4><ul>${by[k].map(s => `<li><b>${esc(shortName(s.name))}</b><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></div>`).join('')}</div></details>`;
}
function sourcesHTML(e){
  if (!e.sources.length) return '';
  return `<details class="fold"><summary><span>來源<small>${e.sources.length} 篇報導</small></span></summary><div class="inner">
    <div class="srcs">${e.sources.map(s => { const l = LEAN[s.lean];
      return `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener"><span style="min-width:0"><b>${esc(s.name)}</b><span class="t">${esc(s.title || hostOf(s.url))}</span></span>
        <span class="pills">${l ? `<span class="pill ${l[1]}">${l[0]}</span>` : ''}${I.ext}</span></a>`; }).join('')}</div>

}

/* 一行：幾家媒體報導、各立場幾家 */
function covLineHTML(e, date){
  const cv = coverage(e), total = e.mediaCount != null ? e.mediaCount : cv.green.length + cv.neutral.length + cv.blue.length + cv.other.length;
  const dots = [['green','g','偏綠'],['neutral','n','中立'],['blue','b','偏藍']].map(([k, c, l]) =>
    `<span class="${cv[k].length ? '' : 'zero'}"><i class="${c}"></i>${l} ${cv[k].length}</span>`).join('');
  const gap = e.gap && !/^無/.test(e.gap.trim()) ? `<p class="gapline">要注意：${esc(e.gap)}</p>` : '';
  return `<div class="covline"><span>${date ? date + ' · ' : ''}${total} 家媒體報導</span><span class="covmini">${dots}</span></div>${gap}`;
}

/* 媒體怎麼寫：依立場分組，跟「人物怎麼說」同一種卡片；跨媒體的提醒另外列在「要注意」 */
function parseLean(rs, e){
  const txt = runsText(rs);
  let m = txt.match(/^\s*(偏綠|偏藍|中立)的?\s*/), lean = null, cut = 0;
  if (m) { lean = { '偏綠':'green', '偏藍':'blue', '中立':'neutral' }[m[1]]; cut = m[0].length; }
  else {
    const src = (e.sources || []).find(s => LEAN[s.lean] && txt.startsWith(shortName(s.name)));
    if (!src) return null;
    lean = src.lean;
  }
  let body = cutRuns(rs, cut), rest = runsText(body), names = [];
  const c = rest.match(/^([^：。，]{1,24})：/);
  if (c) { names = c[1].split(/[、，,／\/]/).map(s => s.trim()).filter(Boolean); body = cutRuns(body, c[0].length); }
  else {
    const src = (e.sources || []).find(s => rest.startsWith(shortName(s.name)));
    if (src) names = [shortName(src.name)];
  }
  return { lean, names, body };
}
function mediaHTML(nodes, e){
  const groups = { green:{ names:[], items:[] }, neutral:{ names:[], items:[] }, blue:{ names:[], items:[] } };
  const tips = [];
  const put = p => { const g = groups[p.lean]; p.names.forEach(n => g.names.includes(n) || g.names.push(n)); g.items.push(p); };
  for (const n of nodes) {
    const rs = n.r || [];
    if (n.c && n.c.length) {
      const parsed = n.c.map(c => parseLean(c.r, e));
      if (parsed.every(Boolean)) { parsed.forEach(put); continue; }
      tips.push(`<div class="tipcard"><b>${runsHTML(rs)}</b><div class="rows">${n.c.map(c => leanRow(c.r, e) || `<div class="row plain"><div>${runsHTML(c.r)}</div></div>`).join('')}</div></div>`);
      continue;
    }
    const bold = rs[0] && rs[0].b;
    const p = bold ? null : parseLean(rs, e);
    if (p) { put(p); continue; }
    if (bold) {
      const rest = rs.slice(1); if (rest[0]) rest[0] = { ...rest[0], x: rest[0].x.replace(/^\s*[：:]\s*/, '') };
      tips.push(`<div class="tipcard"><b>${runsHTML([rs[0]])}</b>${rest.length ? `<div>${runsHTML(rest)}</div>` : ''}</div>`);
    } else tips.push(`<div class="tipcard"><div>${runsHTML(rs)}</div></div>`);
  }
  const cards = ['green','neutral','blue'].filter(k => groups[k].items.length).map(k =>
    `<div class="speaker"><h3><span class="pill ${LEAN[k][1]}">${LEAN[k][0]}</span><span class="names">${groups[k].names.map(esc).join('、')}</span></h3>${groups[k].items.map(it => `<div class="say"><div>${groups[k].items.length > 1 && it.names.length ? `<b>${it.names.map(esc).join('、')}</b>：` : ''}${runsHTML(it.body)}</div></div>`).join('')}</div>`);
  return { count: cards.length, html: `<div class="speakers">${cards.join('')}</div>${tips.length ? `<div class="tip"><h3>要注意</h3>${tips.join('')}</div>` : ''}` };
}
function whoSaysHTML(e, sides, diff){
  const people = sides && sides.body.length ? speakersHTML(sides.body) : '';
  const pCount = (people.match(/class="speaker"/g) || []).length;
  const media = diff && diff.body.length ? mediaHTML(diff.body, e) : null;
  if (!people && !media) return '';
  if (!media) return `<section class="sec"><h2>各方怎麼說</h2>${people}</section>`;
  if (!people) return `<section class="sec"><h2>各家媒體怎麼寫</h2>${media.html}</section>`;
  const id = 'w' + e.id.slice(-6);
  return `<section class="sec"><h2>各方怎麼說</h2><div class="tabs">
    <input type="radio" name="${id}" id="${id}a" checked><input type="radio" name="${id}" id="${id}b">
    <div class="seg" role="presentation"><label for="${id}a">人物<small>${pCount}</small></label><label for="${id}b">媒體<small>${media.count}</small></label></div>
    <div class="panel p1">${people}</div><div class="panel p2">${media.html}</div>
  </div></section>`;
}
function sourcesGroupedHTML(e){
  if (!e.sources.length) return '';
  const order = [['green','偏綠'],['neutral','中立'],['blue','偏藍'],['other','其他']];
  const by = {}; for (const s of e.sources) (by[LEAN[s.lean] ? s.lean : 'other'] ||= []).push(s);
  const cv = coverage(e);
  const indep = e.independentCount != null && e.mediaCount != null
    ? `<p class="srcnote">比對 ${e.mediaCount} 家媒體，其中 ${e.independentCount} 家自己採訪；轉載別家稿子的只算一次。</p>` : '';
  return `<details class="fold"><summary><span>來源與各家標題<small>${e.sources.length} 篇</small></span></summary><div class="inner">${indep}
    ${order.filter(([k]) => by[k]).map(([k, l]) => `<div class="srcgroup"><h4>${LEAN[k] ? `<span class="pill ${LEAN[k][1]}">${l}</span>` : `<span class="pill line">${l}</span>`}${esc((cv[k] || []).join('、'))}</h4>
      ${by[k].map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener"><span style="min-width:0"><b>${esc(shortName(s.name))}</b>${esc(s.title || hostOf(s.url))}</span>${I.ext}</a>`).join('')}</div>`).join('')}
    <p class="srcnote">偏綠、偏藍、中立依一般認知標示，說明見「原則」頁。</p></div></details>`;
}

async function viewEvent(date, id){
  const d = await getDay(date);
  const e = d.events.find(x => x.id === id);
  if (!e) return '<p class="empty">找不到這則事件。</p>';
  let claims = [];
  try { claims = (await getClaims()).claims.filter(c => e.claims.includes(c.id)); } catch(err){}
  const secs = e.sections || [];
  const get = t => secs.find(s => s.title.startsWith(t));
  const sec = (title, inner, cls = '') => `<section class="sec ${cls}"><h2>${esc(title)}</h2>${inner}</section>`;

  /* 第一層：30 秒看懂 */
  const lead = get('一句話看懂'), think = get('看完你可以怎麼想');
  let body = `<section class="summary">
    <div><h2>一句話看懂</h2>${lead ? `<div class="rich">${nodesHTML(lead.body)}</div>` : `<div class="rich"><p>${esc(e.summary || '')}</p></div>`}</div>
    ${think && think.body.length ? `<div class="think"><h2>你可以這樣想</h2><div class="rich">${nodesHTML(think.body)}</div></div>` : ''}
  </section>`;

  /* 第二層：發生了什麼、誰怎麼說 */
  const prior = get('前情');
  if (prior || e.prior.length || e.issues.length) body += sec('前情', `
    ${e.issues.map(i => `<span class="series">系列：${esc(i.name)}</span>`).join('')}
    ${prior ? `<div class="rich">${nodesHTML(prior.body)}</div>` : ''}
    ${e.prior.length ? `<div class="prior">${e.prior.map(p => `<a href="#d-${p.date}"><span>${fmtShort(p.date)}</span><span>${esc(p.title)}</span></a>`).join('')}</div>` : ''}`, 'bg');
  const facts = get('已確認的事實');
  if (facts && facts.body.length) body += sec(facts.title, factsHTML(facts.body, e));
  body += whoSaysHTML(e, get('各方說法'), get('各家報導的差異'));
  const known = ['一句話看懂','看完你可以怎麼想','前情','已確認的事實','各方說法','各家報導的差異','查證說明','來源'];
  for (const s of secs) if (!known.some(o => s.title.startsWith(o)) && s.body.length) body += sec(s.title, `<div class="rich">${nodesHTML(s.body)}</div>`);
  if (!secs.length) body += '<p class="note">完整內文整理中。</p>';

  /* 第三層：想深入再點開 */
  const chk = get('查證說明');
  const chkFold = (chk && chk.body.length) || claims.length ? `<details class="fold"><summary><span>怎麼查證的</span></summary><div class="inner">
    ${chk ? `<ul class="checks">${chk.body.map(n => `<li>${withMark(n.r)}${n.c ? nodesHTML(n.c) : ''}</li>`).join('')}</ul>` : ''}
    ${claims.length ? `<a class="morelink" href="#claims">這則有 ${claims.length} 條說法在「查證追蹤」持續追蹤 →</a>` : ''}</div></details>` : '';
  const src = sourcesGroupedHTML(e);
  if (chkFold || src) body += `<section class="deeper"><p>想深入再點開</p>${chkFold}${src}</section>`;

  const p = e.photo || {};
  return `<div class="ev">
    <div class="ev-head">
      <a class="iconbtn" href="#d-${e.date}" aria-label="回到 ${fmtShort(e.date)} 的事件列表">${I.back}</a>
      <div class="pills">${statusPills(e)}</div>
      <h1 class="ttl">${esc(e.title)}</h1>
      ${covLineHTML(e, fmtShort(e.date))}
      <figure><div class="photo">${img(p.url, '新聞照片', e.title)}</div>
        ${p.credit ? `<figcaption>照片：${esc(p.credit)}${p.source ? ` · <a href="${esc(p.source)}" target="_blank" rel="noopener">原文</a>` : ''}</figcaption>` : ''}</figure>
    </div>
    ${body}
  </div>`;
}

async function viewPrinciples(){
  const p = await getPrinciples();
  const fixRule3 = s => s.title !== '編輯原則' ? s : { ...s, body: s.body.map(n => /^\s*查證狀態/.test(runsText(n.r))
    ? { t: n.t, r: [{ x: '查證狀態', b: 1 }, { x: '：每則事件最上面標示整體的查證程度，每一句說法也各有標記，意思見下方「標記說明」。' }] } : n) };
  const secs = p.sections.filter(s => s.title !== '說法分類').map(fixRule3);

    <li>性質相同時，查證越確定越前面：✅ 經過已證實 → ❌ 有誤 → ⚖️ 各說各話 → ⏳ 待確認</li>
    <li>以上都相同時，依編輯排定的順序。</li></ol>
    <p>不依報導家數排列：報導多寡反映的是媒體的關注度，不等於對讀者的重要性。</p></div></section>`);

}

  subnavHTML = '';
  try {
    if ((m = h.match(/^e-(\d{4}-\d{2}-\d{2})-([0-9a-f]+)$/))) { tab = m[1] === (await getIndex()).latest ? 'today' : 'archive'; html = await viewEvent(m[1], m[2]); }
    else if ((m = h.match(/^d-(\d{4}-\d{2}-\d{2})$/))) { const t = m[1] === (await getIndex()).latest; tab = t ? 'today' : 'archive'; html = await viewDay(m[1], t); }
    else if (h === 'claims') { tab = 'claims'; html = await viewClaims(); }
    else if (h === 'archive') { tab = 'archive'; html = await viewArchive(); }
    else if (h === 'principles') { tab = 'principles'; html = await viewPrinciples(); }
    else html = await viewDay(null, true);
  } catch(err){
    console.error(err);
    html = '<p class="empty">資料載入失敗，請稍後重新整理。</p>';
  }
  $view.innerHTML = html;
  document.getElementById('subnav').innerHTML = subnavHTML;
  document.getElementById('top').classList.toggle('with-tabs', !!subnavHTML);
  document.getElementById('nav').innerHTML = NAV.map(([k,l,ic]) =>
    `<a href="#${k}" ${k === tab ? 'aria-current="page"' : ''}>${ic}${l}</a>`).join('');
  if (h !== lastRoute) window.scrollTo(0, 0);
  lastRoute = h;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-cstatus]');
  if (!t) return;
  if (t.dataset.cat) { state.cat = t.dataset.cat; route().then(() => window.scrollTo(0, 0)); return; }
  state.cf.status = t.dataset.cstatus;
  route();
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.cfield;
  if (f) { state.cf[f] = e.target.value; route(); }
});
document.addEventListener('error', e => {
  const el = e.target;
  if (el.tagName !== 'IMG') return;
  if (el.closest('.hero')) { el.closest('.hero').remove(); return; }
  if (el.dataset.fallback !== undefined) el.parentElement.textContent = el.dataset.fallback;
}, true);
window.addEventListener('hashchange', route);

document.getElementById('siteName').textContent = CONFIG.siteName;
route();
</script>
</body>
</html>
